<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Espartano | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="login-card" aria-labelledby="login-title">
        <aside class="login-brand" aria-label="Espartano">
          <div class="brand-copy">
            <span class="brand-kicker">Sistema</span>
            <h1>Espartano</h1>
          </div>

          <div class="logo-ring">
            <img src="img/espartano-mark.png" alt="Logo Espartano" class="brand-logo">
          </div>

          <div class="brand-status" aria-label="Status da plataforma">
            <span class="status-dot" aria-hidden="true"></span>
            <span>Ambiente conectado</span>
          </div>
        </aside>

        <section class="login-panel">
          <div class="panel-accent" aria-hidden="true"></div>

          <header class="form-header">
            <p>Acesso ao sistema</p>
            <h2 id="login-title">Identificação</h2>
            <span>Insira suas credenciais para continuar</span>
          </header>

          <form id="loginForm" class="login-form" novalidate>
            <div class="field-group">
              <label for="identifier">Usuário ou e-mail</label>
              <div class="field-wrap">
                <svg aria-hidden="true" class="field-icon" viewBox="0 0 24 24">
                  <path d="M20 21a8 8 0 1 0-16 0"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <input id="identifier" name="identifier" type="text" autocomplete="username" placeholder="seu@email.com ou usuário" required>
              </div>
            </div>

            <div class="field-group">
              <label for="password">Senha</label>
              <div class="field-wrap">
                <svg aria-hidden="true" class="field-icon" viewBox="0 0 24 24">
                  <rect x="4" y="11" width="16" height="10" rx="2"></rect>
                  <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
                </svg>
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="********" required>
                <button class="icon-button field-action" id="togglePassword" type="button" aria-label="Mostrar senha" title="Mostrar senha">
                  <svg class="eye-open" aria-hidden="true" viewBox="0 0 24 24">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg class="eye-closed" aria-hidden="true" viewBox="0 0 24 24">
                    <path d="m2 2 20 20"></path>
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                    <path d="M17.9 17.9C16.2 18.8 14.2 19 12 19 5.5 19 2 12 2 12a18.5 18.5 0 0 1 5.1-5.8"></path>
                    <path d="M9.9 5.2A9.5 9.5 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-2.1 3.1"></path>
                  </svg>
                </button>
              </div>
            </div>

            <div id="twoFactorGroup" class="field-group two-factor-group" hidden>
              <label for="twoFactorCode">Código 2FA</label>
              <div class="field-wrap">
                <svg aria-hidden="true" class="field-icon" viewBox="0 0 24 24">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"></path>
                  <path d="m9 12 2 2 4-4"></path>
                </svg>
                <input id="twoFactorCode" name="twoFactorCode" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="000000">
              </div>
            </div>

            <div class="form-row">
              <label class="check-control" for="rememberMe">
                <input id="rememberMe" name="rememberMe" type="checkbox">
                <span class="custom-check" aria-hidden="true"></span>
                <span>Manter conectado</span>
              </label>

              <button id="recoverPassword" class="link-button" type="button">Recuperar senha</button>
            </div>

            <button class="submit-button" id="submitButton" type="submit">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"></path>
                <path d="m9 12 2 2 4-4"></path>
              </svg>
              <span>Acessar</span>
            </button>
          </form>
        </section>
      </section>
    </main>

    <dialog id="recoverDialog" class="recover-dialog" aria-labelledby="recoverTitle">
      <form method="dialog" class="dialog-panel" id="recoverForm">
        <div class="dialog-header">
          <p>Redefinição de acesso</p>
          <h2 id="recoverTitle">Recuperar senha</h2>
        </div>

        <label class="dialog-field" for="recoverEmail">
          E-mail cadastrado
          <input id="recoverEmail" name="recoverEmail" type="email" autocomplete="email" placeholder="seu@email.com" required>
        </label>

        <div class="dialog-actions">
          <button class="secondary-button" id="closeRecover" type="button">Cancelar</button>
          <button class="primary-button" id="sendRecovery" type="submit">Enviar link</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M12 8v4"></path>
        <path d="M12 16h.01"></path>
      </svg>
      <span id="toastMessage">Credenciais inválidas</span>
    </div>

    <script src="app.js"></script>
  </body>
</html>

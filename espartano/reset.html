<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Espartano | Redefinir Senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="login-card reset-card" aria-labelledby="resetTitle">
        <aside class="login-brand" aria-label="Espartano">
          <div class="brand-copy">
            <span class="brand-kicker">Sistema</span>
            <h1>Espartano</h1>
          </div>
          <div class="logo-ring">
            <img src="img/espartano-mark.png" alt="Logo Espartano" class="brand-logo">
          </div>
          <div class="brand-status" aria-label="Status da plataforma">
            <span class="status-dot" aria-hidden="true"></span>
            <span>Ambiente conectado</span>
          </div>
        </aside>

        <section class="login-panel">
          <div class="panel-accent" aria-hidden="true"></div>
          <header class="form-header">
            <p>Redefinição de acesso</p>
            <h2 id="resetTitle">Nova senha</h2>
            <span>Informe uma senha para concluir a redefinição</span>
          </header>

          <form id="resetForm" class="login-form" novalidate>
            <div class="field-group">
              <label for="newPassword">Senha</label>
              <div class="field-wrap">
                <svg aria-hidden="true" class="field-icon" viewBox="0 0 24 24">
                  <rect x="4" y="11" width="16" height="10" rx="2"></rect>
                  <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
                </svg>
                <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" placeholder="********" minlength="8" required>
              </div>
            </div>

            <div class="field-group">
              <label for="confirmPassword">Confirmar senha</label>
              <div class="field-wrap">
                <svg aria-hidden="true" class="field-icon" viewBox="0 0 24 24">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"></path>
                  <path d="m9 12 2 2 4-4"></path>
                </svg>
                <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="********" minlength="8" required>
              </div>
            </div>

            <button class="submit-button" type="submit">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M20 6 9 17l-5-5"></path>
              </svg>
              <span>Salvar senha</span>
            </button>
          </form>
        </section>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M12 8v4"></path>
        <path d="M12 16h.01"></path>
      </svg>
      <span id="toastMessage">Credenciais inválidas</span>
    </div>

    <script src="reset.js"></script>
  </body>
</html>

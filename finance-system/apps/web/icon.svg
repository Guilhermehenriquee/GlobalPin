<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Finance System</title>
  <desc id="desc">Marca futurista com escudo financeiro, linha de crescimento, IA, Open Finance e perfis PF e PJ conectados.</desc>
  <defs>
    <linearGradient id="bg" x1="56" y1="40" x2="456" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F1B32"/>
      <stop offset=".48" stop-color="#070B14"/>
      <stop offset="1" stop-color="#12113A"/>
    </linearGradient>
    <linearGradient id="edge" x1="88" y1="76" x2="432" y2="436" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4"/>
      <stop offset=".48" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="growth" x1="128" y1="306" x2="392" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981"/>
      <stop offset=".55" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.023 0 0 0 0 0.714 0 0 0 0 0.831 0 0 0 .55 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="34" y="34" width="444" height="444" rx="96" fill="none" stroke="url(#edge)" stroke-width="12" opacity=".78"/>
  <rect x="62" y="62" width="388" height="388" rx="78" fill="none" stroke="#63B3FF" stroke-width="3" opacity=".18"/>

  <path d="M256 96 374 144v88c0 86-48 151-118 184-70-33-118-98-118-184v-88l118-48Z" fill="#0D1525" stroke="url(#edge)" stroke-width="14" stroke-linejoin="round"/>
  <path d="M256 129 340 163v66c0 62-33 111-84 138-51-27-84-76-84-138v-66l84-34Z" fill="#111B2E" opacity=".9"/>

  <path d="M136 312c42 0 70-18 91-56l38 52c24-77 57-112 111-124" fill="none" stroke="url(#growth)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M178 222h104" fill="none" stroke="#F1F5F9" stroke-width="22" stroke-linecap="round" opacity=".96"/>
  <path d="M178 268h76" fill="none" stroke="#F1F5F9" stroke-width="22" stroke-linecap="round" opacity=".9"/>
  <path d="M178 222v116" fill="none" stroke="#F1F5F9" stroke-width="22" stroke-linecap="round" opacity=".96"/>

  <circle cx="122" cy="232" r="17" fill="#10B981"/>
  <circle cx="390" cy="166" r="17" fill="#8B5CF6"/>
  <circle cx="256" cy="310" r="19" fill="#06B6D4" stroke="#F1F5F9" stroke-width="7"/>
  <path d="M139 232h42M272 302l86-116M253 291l-50-47" fill="none" stroke="#63B3FF" stroke-width="7" stroke-linecap="round" opacity=".52"/>

  <path d="M109 383h294" stroke="#3B82F6" stroke-width="10" stroke-linecap="round" opacity=".22"/>
  <path d="M197 395h118" stroke="#06B6D4" stroke-width="10" stroke-linecap="round" opacity=".42"/>
